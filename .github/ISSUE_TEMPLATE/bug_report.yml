name: Bug report
description: DBDSilicon or the game doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac
      placeholder: MacBook Air M2, 16 GB
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DBDSilicon version
      placeholder: "1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Attach the newest files from ~/Library/Logs/DBDSilicon/Steam (Finder → Go → Go to Folder…).
        They may contain your Steam account ID.
